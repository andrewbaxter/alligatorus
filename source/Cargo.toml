[package]
name = "source"
version = "0.1.0"
edition = "2024"

[dependencies]
aargvark = { version = "0.9", features = ["serde_json"] }
dumpster = "2.1.0"
flowcontrol = "0.2"
futures = "0.3"
http = "1"
#htwrap = "0.15"
paste = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_json_canonicalizer = "0.3"
tokio = { version = "1", features = [
    "rt-multi-thread",
    "time",
    "fs",
    "net",
    "process",
    "macros",
] }
urlencoding = "2"
v8 = "146"

[lints.clippy]
all = "allow"
