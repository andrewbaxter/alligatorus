[package]
name = "source"
version = "0.1.0"
edition = "2024"

[dependencies]
prefixes = { path = "prefixes" }
aargvark = { version = "0.9", features = ["serde_json"] }
dumpster = "2.1.0"
flowcontrol = "0.2"
http = "1"
ordered-float = { version = "5.3.0", features = ["serde"] }
#htwrap = "0.15"
paste = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_json_canonicalizer = "0.3"
regex = "1"
urlencoding = "2"
v8 = "146"

[build-dependencies]
prefixes = { path = "prefixes" }
genemichaels-lib = "0.5"
quote = "1"
proc-macro2 = "1"

[lints.clippy]
all = "allow"
