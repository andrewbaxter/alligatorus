name: lint

on:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      # The main module generates the language server bindings from merman's
      # schema with schemask at build time.
      - uses: actions/cache@v4
        id: schemask
        with:
          path: ~/.cargo/bin/schemask
          key: schemask-0.1.6

      - if: steps.schemask.outputs.cache-hit != 'true'
        run: cargo install schemask --version 0.1.6 --locked

      # Compiling the whole reactor runs Spotless on every module, the
      # reachability analysis (which needs every module's classpath written by
      # the build) and the doc guard. The guard compares against the branch the
      # request targets, so a comment added anywhere on the branch is rejected,
      # where a local run compares against HEAD.
      - name: Lint
        run: mvn -B compile -Ddocguard.against=origin/${{ github.base_ref }}
